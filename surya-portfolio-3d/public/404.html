<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Surya Prakash Boda — Creative Developer</title>
    <!--
      GitHub Pages serves this file for any unknown path (e.g. a direct
      visit or refresh on /projects). Since this is a client-side-routed
      React app, we redirect back to index.html and stash the intended
      path in the query string; index.html's inline script (below/in head)
      restores it via history.replaceState before React Router mounts.
      Pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 1; // keep "/surya-portfolio-3d"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
