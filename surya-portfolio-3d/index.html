<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Surya Prakash Boda — Creative Developer. An immersive 3D portfolio." />
    <title>Surya Prakash Boda — Creative Developer</title>
    <!--
      Pairs with public/404.html — decodes a redirected GitHub Pages deep
      link (?p=/projects/moon-ai) back into a real path before React Router
      mounts, so refreshing/sharing a sub-page URL works.
      Pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var decoded = l.search.slice(3).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded[0] + (decoded[1] ? '?' + decoded[1] : '') + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
